name: Validate and repair production toolchain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repair strict TypeScript source patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              s = p.read_text()
              original = s
              for old, new in replacements:
                  if old not in s:
                      continue
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s)

          replace('src/lib/aetheris.ts', [
              ('export const PLANS: Plan[] = [', 'export const PLANS: [Plan, ...Plan[]] = ['),
              ('export const WALLETS: Record<string, string> =', 'export const WALLETS: Record<"BTC" | "ETH" | "USDT-TRC20", string> ='),
              (' || PLANS[0];', ' || PLANS[0]!;'),
              ('return data.map((d: any) => {', 'return data.map((d: any): Investment => {'),
              ('list[idx] = { ...list[idx], ...updates };\n    this.saveInvestments(list);\n    return list[idx];', 'const current = list[idx];\n    if (!current) return null;\n    list[idx] = { ...current, ...updates };\n    this.saveInvestments(list);\n    return list[idx] ?? null;'),
          ])

          replace('src/components/AuthModal.tsx', [
              ('metadata?.name', 'metadata?.["name"]'),
              ('metadata?.full_name', 'metadata?.["full_name"]'),
              ('metadata?.ref_code', 'metadata?.["ref_code"]'),
              ('            referred_by: refCode || undefined,\n', '            ...(refCode ? { referred_by: refCode } : {}),\n'),
          ])

          replace('src/components/AuthPage.tsx', [
              ('authData.user.user_metadata?.name', 'authData.user.user_metadata?.["name"]'),
              ('authData.user.user_metadata?.full_name', 'authData.user.user_metadata?.["full_name"]'),
              ('authData.user.user_metadata?.ref_code', 'authData.user.user_metadata?.["ref_code"]'),
              ('            referred_by: refCode || undefined,\n', '            ...(refCode ? { referred_by: refCode } : {}),\n'),
          ])

          replace('src/components/LeadForm.tsx', [
              ('        phone,\n', '        ...(phone ? { phone } : {}),\n'),
          ])

          replace('src/components/SupportChat.tsx', [
              ('WALLETS.BTC', 'WALLETS["BTC"]'),
              ('WALLETS.ETH', 'WALLETS["ETH"]'),
          ])

          replace('src/integrations/supabase/client.ts', [
              ('import.meta.env.VITE_SUPABASE_URL', 'import.meta.env["VITE_SUPABASE_URL"]'),
              ('import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY', 'import.meta.env["VITE_SUPABASE_PUBLISHABLE_KEY"]'),
          ])

          replace('src/dashboard/Dashboard.tsx', [
              ('        userId={user?.id || profile?.id}\n', '        {...((user?.id || profile?.id) ? { userId: user?.id || profile?.id } : {})}\n'),
              ('              onChoosePlan={onChoosePlan}\n', '              {...(onChoosePlan ? { onChoosePlan } : {})}\n'),
          ])

          replace('src/legacy/LegacyRoot.tsx', [
              ('          onOpenCiCd={onOpenCiCd}\n', '          {...(onOpenCiCd ? { onOpenCiCd } : {})}\n'),
          ])
          PY

      - name: Format source
        run: npm run format

      - name: Auto-fix lint issues
        run: |
          set -o pipefail
          npm run lint -- --fix 2>&1 | tee lint.log

      - name: Verify lint
        run: npm run lint

      - name: Build and regenerate route tree
        run: npm run build

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Commit repaired source, lockfile, and generated route tree
        run: |
          if git diff --quiet; then
            echo "Working tree is already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete production toolchain audit"
          git push origin main

      - name: Upload lint diagnostics
        if: always() && hashFiles('lint.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
