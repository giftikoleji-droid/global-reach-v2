name: Validate and repair production toolchain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Auto-format and auto-fix lint issues
        run: npm run lint -- --fix

      - name: Verify lint
        run: npm run lint

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Build and regenerate route tree
        run: npm run build

      - name: Commit repaired source, lockfile, and generated route tree
        run: |
          if git diff --quiet; then
            echo "Working tree is already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete production toolchain audit"
          git push origin main
