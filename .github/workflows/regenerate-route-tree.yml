name: Validate and repair production toolchain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npm run format

      - name: Auto-fix lint issues
        run: |
          set -o pipefail
          npm run lint -- --fix 2>&1 | tee lint.log

      - name: Verify lint
        run: npm run lint

      - name: Build and regenerate route tree
        run: npm run build

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Commit repaired source, lockfile, and generated route tree
        run: |
          if git diff --quiet; then
            echo "Working tree is already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete production toolchain audit"
          git push origin main

      - name: Upload lint diagnostics
        if: always() && hashFiles('lint.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: ignore
