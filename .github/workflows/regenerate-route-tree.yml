name: Regenerate TanStack Route Tree

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-route-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate route tree
        run: npx --yes tanstack-router-generator

      - name: Commit generated route tree
        run: |
          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "Route tree is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          git commit -m "chore: regenerate TanStack route tree"
          git push origin main
